[pytest]
pythonpath = ..
addopts = -ra --strict-markers --tb=short
markers =
    parquet_data: Data quality checks for the aggregated parquet datasets
    smoke: Quick readability / not-empty checks
    example: Wiring examples only (not production checks)
    facility_name_min_time_spent_per_visit_date: Checks for facility_name_min_time_spent_per_visit_date
    facility_type_avg_time_spent_per_visit_date: Checks for facility_type_avg_time_spent_per_visit_date
    patient_sum_treatment_cost_per_facility_type: Checks for patient_sum_treatment_cost_per_facility_type
